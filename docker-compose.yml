services:
  app:
    # Hem "build:" hem "image:" birlikte tanımlı — iki farklı kullanım
    # tek dosyada bir arada çalışır:
    #  · Kodu kendiniz değiştirip test ediyorsanız: yine eskisi gibi
    #    "docker compose up -d --build" yazarsınız, yereldeki Dockerfile'dan
    #    derler (README'deki adım değişmedi).
    #  · Sunucuda/üretimde çalıştırıyorsanız: artık HİÇBİR komut yazmaya
    #    gerek yok. GitHub Actions her push'ta imajı otomatik derleyip GHCR'a
    #    (ghcr.io) yüklüyor (bkz. .github/workflows/ci.yml → docker-image
    #    job'u), "pull_policy: always" sayesinde düz "docker compose up -d"
    #    (--build OLMADAN) her zaman en güncel imajı çeker, ve aşağıdaki
    #    "watchtower" servisi de yeni bir sürüm çıktığında container'ı
    #    kendisi fark edip indirip yeniden başlatır — yani ilk kurulumdan
    #    sonra tek bir komut bile yazmanıza gerek kalmaz.
    build: .
    # NOT: Depo beyziki/ulasim-bakim'den beyziki/ulasim-bakim-v2'ye taşındı
    # (eski depoda GitHub Actions kısıtlanmıştı, GitHub Destek'e bildirildi).
    # GitHub Actions imajı her zaman "ghcr.io/<repo adı>" olarak etiketler
    # (bkz. .github/workflows/ci.yml → images: ghcr.io/${{ github.repository }}),
    # bu yüzden bu satır da yeni depo adıyla güncellendi.
    image: ghcr.io/beyziki/ulasim-bakim-v2:latest
    pull_policy: always
    labels:
      # Watchtower yalnızca bu etikete sahip container'ları izler (aşağıda
      # WATCHTOWER_LABEL_ENABLE=true ile) — sunucuda başka container'lar
      # varsa onlara dokunulmaz.
      - "com.centurylinklabs.watchtower.enable=true"
    container_name: ulasim-bakim
    # Konteyner İÇİNDE uygulama her zaman 8000 portunda çalışır (Dockerfile/
    # docker-entrypoint.sh) — bu sabittir, değişmez. Ama HOST tarafındaki
    # port (solundaki sayı) sunucuda çakışabilir: aynı sunucuda başka bir
    # proje (ör. "datalogger") de 8000'i kullanmaya çalışırsa ikisi birden
    # ayakta duramaz ("port zaten kullanımda" hatası). Bunu önlemek için
    # host portu APP_PORT ortam değişkeninden okunur (varsayılan 8001,
    # klasik 8000'den bilerek farklı). Bu sunucuda BİRDEN FAZLA proje
    # çalıştıracaksanız: bu depodaki (docker-compose.yml ile aynı klasördeki)
    # ".env" dosyasına "APP_PORT=8001" gibi HER PROJE İÇİN FARKLI bir değer
    # yazın (örn. ulasim-bakim=8001, datalogger=8002 vb.) — .env.example'a bakın.
    ports:
      - "${APP_PORT:-8001}:8000"
    # backend/.env, build sırasında imaja KOPYALANMAZ (.dockerignore'da
    # bilerek hariç tutulur — sırlar imaja gömülmesin diye). Bunun yerine
    # docker compose up sırasında HOST'taki bu dosya konteynere ortam
    # değişkeni olarak enjekte edilir; böylece SMTP_* gibi ayarları
    # backend/.env dosyasından değiştirip yalnızca konteyneri yeniden
    # başlatmak (docker compose up -d) yeterli olur, imajı yeniden
    # derlemeye (build) gerek kalmaz. Aşağıdaki environment: bloğu, aynı
    # anahtar için env_file'daki değerin ÜZERİNE yazar (compose önceliği).
    #
    # ÖNEMLİ (GitHub'a pushlarken güvenlik): SECRET_KEY buraya SABİT/AÇIK
    # metin olarak YAZILMAZ — bilerek yalnızca backend/.env'den gelir
    # (o dosya .gitignore'da, hiç commit'e girmez). Böylece bu dosya
    # (docker-compose.yml) git'e eklense/pushlansa bile gerçek anahtar
    # sızmaz. backend/.env yoksa/SECRET_KEY boşsa auth.py kendi varsayılan
    # (üretimde MUTLAKA değiştirilmesi gereken) değerine düşer.
    env_file:
      - backend/.env
    environment:
      # Saat dilimi — uygulama tarih/saatleri sunucunun YEREL saatiyle yazar
      # (datetime.now()). Konteyner varsayılanı UTC olduğundan Türkiye'de tüm
      # kayıtlar 3 saat geride görünüyordu. Başka bir ülkede kullanılacaksa
      # yalnızca bu satır değişir (imajın kendi varsayılanı da Europe/Istanbul,
      # bkz. Dockerfile).
      TZ: "Europe/Istanbul"
      # Veritabanı kalıcı volume içinde (db-data). SQLite mutlak yol (4 bölü).
      DATABASE_URL: "sqlite:////app/data/ulasim_bakim.db"
      # Siteyi gerçek bir alan adından yayınlarken buraya o adresi yazın
      # (ör. "https://bakim.sirketiniz.com"). Boş/"*" bırakılırsa tüm
      # kaynaklara izin verilir — yalnızca dış erişimi olmayan/iç ağ
      # kullanımında güvenli kabul edilir.
      ALLOWED_ORIGIN: "*"
      # Otomatik veritabanı yedeklerinin yazıldığı klasör (ayrı volume).
      BACKUP_DIR: "/app/backups"
      # Parça Bilgi Bankası'ndaki arka plan kaldırma modelinin (u2netp)
      # önbelleği — kalıcı volume'de tutulur, aksi halde konteyner her
      # yeniden başlatıldığında/derlendiğinde modeli tekrar internetten
      # indirmesi gerekir.
      U2NET_HOME: "/app/model_cache"
      # Merkezi loglama (Faz 23) — uygulama/hata/erişim logları kalıcı
      # volume'de tutulur, konteyner yeniden oluşturulsa bile korunur.
      LOG_DIR: "/app/logs"
    volumes:
      - db-data:/app/data                      # veritabanı kalıcı
      - uploads:/app/backend/uploads           # yüklenen dosyalar (foto/PDF/3D model) kalıcı
      - backups:/app/backups                   # otomatik veritabanı yedekleri (db-data'dan AYRI volume — db-data silinse/bozulsa bile yedekler korunur)
      - model-cache:/app/model_cache            # arka plan kaldırma AI modeli önbelleği
      - logs:/app/logs                          # merkezi loglama (uygulama/hata/erişim logları)
    restart: unless-stopped

  # Watchtower — GHCR'daki "ulasim-bakim:latest" imajının yeni bir sürümü
  # yüklendiğinde (yani GitHub Actions bir push sonrası imajı güncellediğinde)
  # bunu periyodik olarak kontrol eder, farkederse imajı indirip "app"
  # container'ını otomatik olarak yeni sürümle yeniden başlatır. Bu sayede
  # sunucuda elle "docker compose pull && docker compose up -d" (ya da
  # "--build") yazmaya hiç gerek kalmaz.
  #
  # GHCR paketi PRIVATE ise (varsayılan budur) Watchtower'ın imajı
  # indirebilmesi için sunucuda BİR KEZ giriş yapmanız gerekir:
  #   docker login ghcr.io -u <github-kullanıcı-adınız> -p <PAT (read:packages)>
  # Bu, docker daemon'ın kimlik bilgilerini yerelde saklamasını sağlar ve
  # Watchtower bunları otomatik kullanır (ekstra ayar gerekmez). Alternatif
  # olarak GHCR paket ayarlarından "Change visibility → Public" yaparsanız
  # login adımına hiç gerek kalmaz.
  watchtower:
    image: containrrr/watchtower
    container_name: ulasim-bakim-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Yalnızca "com.centurylinklabs.watchtower.enable=true" etiketli
      # container'ları izler (yukarıdaki "app" servisi) — sunucudaki diğer
      # container'lara dokunmaz.
      WATCHTOWER_LABEL_ENABLE: "true"
      # Her 5 dakikada bir GHCR'ı kontrol eder (saniye cinsinden).
      WATCHTOWER_POLL_INTERVAL: "300"
      # Güncelledikten sonra eski (artık kullanılmayan) imajları temizler,
      # disk dolmasın diye.
      WATCHTOWER_CLEANUP: "true"
      # Yalnızca bu container'ı güncelle, kendi kendini yeniden başlatma
      # döngüsüne girme.
      WATCHTOWER_INCLUDE_RESTARTING: "false"
    restart: unless-stopped

volumes:
  db-data:
  uploads:
  backups:
  model-cache:
  logs:
