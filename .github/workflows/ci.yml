name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Bağımlılıkları kur
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: pytest çalıştır
        working-directory: backend
        run: pytest -v

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıkları kur
        working-directory: frontend
        run: npm ci

      - name: Tip kontrolü + build
        working-directory: frontend
        run: npm run build

  # Testler (backend + frontend) geçtikten SONRA, yalnızca deponun varsayılan
  # dalına (main/master, ne ise) push edildiğinde çalışır. Sunucuya OTOMATİK
  # dağıtım (CD) YAPMAZ — imajı GitHub Container Registry'ye (ghcr.io) push
  # eder, kendi sunucunuzda güncellemek için orada şunu çalıştırmanız yeterli:
  #   docker compose pull && docker compose up -d
  # (docker-compose.yml'de "build:" yerine "image: ghcr.io/<repo>:latest"
  # kullanmanız gerekir — bkz. README/deploy notları.)
  docker-image:
    name: Docker image build + push (GHCR)
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Buildx kurulumu
        uses: docker/setup-buildx-action@v3

      - name: GHCR'a giriş yap
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiketleri hazırla
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
